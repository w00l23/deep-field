<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wormhole — Earth to Saturn</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
               user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: pointer; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom));
    text-align: center; pointer-events: none; user-select: none; -webkit-user-select: none;
    font: 500 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    letter-spacing: .28em; text-transform: uppercase;
    color: #eadcff; text-shadow: 0 0 16px rgba(138, 43, 226, .95), 0 0 2px rgba(0, 0, 0, .8);
    opacity: 0; transition: opacity .3s ease;
  }
  #hint.on { opacity: .82; transition: opacity 1.4s ease; }
  #snd {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; padding: 10px; background: none; border: 0; cursor: pointer;
    font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; letter-spacing: .24em; text-transform: uppercase;
    color: #eadcff; text-shadow: 0 0 12px rgba(138, 43, 226, .9); opacity: .4; transition: opacity .3s ease;
  }
  #snd:hover, #snd:focus-visible { opacity: .9; outline: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<button id="snd" type="button">Sound: chimes</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const rad = THREE.MathUtils.degToRad;
const clamp01 = x => Math.min(1, Math.max(0, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);

// ═════════════════════════════════════════════════════════════════════════
//  THE ROUTE — one spline from the waiting spot by Earth, in through the
//  mouth, down the tube, out the far mouth, to a stop in front of Saturn
// ═════════════════════════════════════════════════════════════════════════
const Y = V3(0, 1, 0);
const SUN = V3(-0.6, 0.35, 0.72).normalize();           // direction TO the sun, same for both worlds

const CAM0 = V3(0.25, 0.3, 3.6);                        // where the camera waits
const LOOK0 = V3(0.62, 0.12, 0);                        // a little right of Earth's centre
const DIR_A = V3(0.42, -0.04, -0.9).normalize(), R_A = 0.5;
const MOUTH_A = V3(1.75, 0.35, 1.0).addScaledVector(DIR_A, 12);   // out in empty space past Earth's limb: where the ship will tear in
const TUBE_DIR = V3(0.5, -0.22, -0.84).normalize(), R_TUBE = 1.1;
const MOUTH_B = MOUTH_A.clone().addScaledVector(TUBE_DIR, 95), DIR_B = V3(0.43, -0.34, -0.837).normalize();
const E = MOUTH_B.clone().addScaledVector(DIR_B, 7);    // where the flight comes to rest

const pts = [CAM0.clone(), CAM0.clone().lerp(MOUTH_A, 0.5).add(V3(-0.05, 0.03, 0)), MOUTH_A.clone().addScaledVector(DIR_A, -0.9)];
const iA = pts.length;
pts.push(MOUTH_A.clone(), MOUTH_A.clone().addScaledVector(DIR_A, 1.5), MOUTH_A.clone().addScaledVector(DIR_A, 4.5));
{ // the winding middle: a straight line pushed sideways by two slow sines, calm at both ends
  const a = MOUTH_A.clone().addScaledVector(DIR_A, 4.5), b = MOUTH_B.clone().addScaledVector(DIR_B, -12);
  const e1 = V3().crossVectors(TUBE_DIR, Y).normalize(), e2 = V3().crossVectors(e1, TUBE_DIR).normalize();
  for (let i = 1, n = 8; i <= n; i++) {
    const k = i / (n + 1), env = Math.pow(Math.sin(Math.PI * k), 0.7);
    pts.push(a.clone().lerp(b, k).addScaledVector(e1, 5.5 * env * Math.sin(i * 1.15 + 0.5)).addScaledVector(e2, 4.0 * env * Math.sin(i * 0.85 + 2.1)));
  }
}
pts.push(MOUTH_B.clone().addScaledVector(DIR_B, -12), MOUTH_B.clone().addScaledVector(DIR_B, -6));
const iB = pts.length;
pts.push(MOUTH_B.clone(), MOUTH_B.clone().addScaledVector(DIR_B, 3.5), E.clone());

const path = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
const SEG = 120;
path.arcLengthDivisions = (pts.length - 1) * SEG; path.updateArcLengths();
const LEN = path.getLengths();
const S_END = LEN[LEN.length - 1], S_A = LEN[iA * SEG], S_B = LEN[iB * SEG];   // distance along the route to each mouth

function pathPos(s, out) {
  if (s <= S_END) return path.getPointAt(Math.max(0, s) / S_END, out);
  return out.copy(E).addScaledVector(DIR_B, s - S_END);
}

// "up" carried along the route without twisting (parallel transport), so the camera never flips
const FR_STEP = 0.1, FR_N = Math.ceil(S_END / FR_STEP), frameUp = new Float32Array((FR_N + 1) * 3);
{ const T = V3(), n = Y.clone();
  for (let i = 0; i <= FR_N; i++) {
    path.getTangentAt(Math.min(1, i * FR_STEP / S_END), T);
    n.addScaledVector(T, -n.dot(T)).normalize().toArray(frameUp, i * 3);
  } }
// …and the slow roll that brings it back level by the time the far mouth arrives
let ROLL_FIX = 0;
{ const sRef = S_B - 5, T = path.getTangentAt(sRef / S_END, V3()), n = V3().fromArray(frameUp, Math.round(sRef / FR_STEP) * 3);
  const yP = Y.clone().addScaledVector(T, -Y.dot(T)).normalize();
  ROLL_FIX = Math.atan2(V3().crossVectors(n, yP).dot(T), n.dot(yP)); }

// how fast. The launch runs on its own clock: a hard burn from a standstill that levels off at top speed by T_ACC, then
// holds it. Its top speed is whatever gets the camera to the mouth at T_ENTRY. From the mouth on it goes by where:
// carried faster down the tube → cruise → ease out and settle.
const T_ACC = 2.4, ACC_P = 2.2, T_ENTRY = 5.0;
const V_TOP = S_A / (T_ACC * ACC_P / (ACC_P + 1) + T_ENTRY - T_ACC);
const launchV = t => V_TOP * (1 - Math.pow(1 - clamp01(t / T_ACC), ACC_P));
function speedAt(s) {
  let v = lerp(V_TOP, 7.0, ss(S_A, S_A + 14, s));
  v += 1.8 * ss(S_A + 18, S_A + 45, s) * (1 - ss(S_B - 45, S_B - 20, s));
  v *= lerp(1, 0.55, ss(S_B - 18, S_B + 1, s));
  return Math.min(v, 0.012 + 0.85 * (S_END - s));
}
const TAB_DT = 1 / 120, tab = [];
{ let s = 0, t = 0; while (s < S_END - 0.012 && tab.length < 120 * 120) { tab.push(s); s += (s < S_A ? launchV(t) : speedAt(s)) * TAB_DT; t += TAB_DT; } tab.push(s); }

const sAt = t => {
  const x = Math.max(0, t) / TAB_DT, i = Math.min(Math.floor(x), tab.length - 1), j = Math.min(i + 1, tab.length - 1);
  return lerp(tab[i], tab[j], x - Math.floor(x));
};
const timeOf = s0 => tab.findIndex(v => v >= s0) * TAB_DT;
const T_A = timeOf(S_A), T_B = timeOf(S_B);             // the moments the camera crosses each mouth
const T_PULL = T_B + 2.2, PULL_DUR = 10, T_DONE = T_PULL + PULL_DUR;

// Saturn, and the last frame the pull-back is heading for
const R_SAT = 6, D_FIN = 38, OBL = 0.902;             // OBL: Saturn is that much shorter pole to pole than across
const RIGHT_B = V3().crossVectors(DIR_B, Y).normalize(), UP_B = V3().crossVectors(RIGHT_B, DIR_B);
const SAT_POS = MOUTH_B.clone().addScaledVector(DIR_B, 27).addScaledVector(RIGHT_B, -3.2).addScaledVector(UP_B, 0.8);
const VIEW_FIN = SUN.clone().addScaledVector(V3().crossVectors(Y, SUN).normalize(), 0.6).addScaledVector(Y, -0.25).normalize();
const RIGHT_FIN = V3().crossVectors(VIEW_FIN.clone().negate(), Y).normalize(), UP_FIN = V3().crossVectors(RIGHT_FIN, VIEW_FIN.clone().negate());
// the pole is chosen from that last frame: rings opened 16° toward us, leaning 20° on the screen
const SAT_POLE = VIEW_FIN.clone().multiplyScalar(Math.sin(rad(16)))
  .addScaledVector(UP_FIN, Math.cos(rad(16)) * Math.cos(rad(20))).addScaledVector(RIGHT_FIN, Math.cos(rad(16)) * Math.sin(rad(20))).normalize();
const DIR_E = E.clone().sub(SAT_POS), DIST_E = DIR_E.length(); DIR_E.normalize();
const OMEGA = Math.acos(DIR_E.dot(VIEW_FIN));
function pullArc(k, out) {                               // swing round Saturn while backing away
  const a = Math.sin((1 - k) * OMEGA) / Math.sin(OMEGA), b = Math.sin(k * OMEGA) / Math.sin(OMEGA);
  return out.copy(DIR_E).multiplyScalar(a).addScaledVector(VIEW_FIN, b).multiplyScalar(lerp(DIST_E, D_FIN, k)).add(SAT_POS);
}

// ═════════════════════════════════════════════════════════════════════════
//  SHADER PIECES shared by several materials
// ═════════════════════════════════════════════════════════════════════════
const NOISE = /* glsl */`
float hash3(ivec3 c) {
  uvec3 q = uvec3(c) * uvec3(1597334673u, 3812015801u, 2798796415u);
  uint n = (q.x ^ q.y ^ q.z) * 1597334673u;
  n ^= n >> 15u; n *= 2246822519u; n ^= n >> 13u;
  return float(n) * (1.0 / 4294967296.0);
}
// smooth value noise: a random number at every whole-number corner, blended softly in between
float vnoise(vec3 p) {
  vec3 fl = floor(p), f = p - fl;
  ivec3 i = ivec3(fl);
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(
    mix(mix(hash3(i), hash3(i + ivec3(1, 0, 0)), u.x), mix(hash3(i + ivec3(0, 1, 0)), hash3(i + ivec3(1, 1, 0)), u.x), u.y),
    mix(mix(hash3(i + ivec3(0, 0, 1)), hash3(i + ivec3(1, 0, 1)), u.x), mix(hash3(i + ivec3(0, 1, 1)), hash3(i + ivec3(1, 1, 1)), u.x), u.y),
    u.z);
}
const mat3 ROT = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);
float fbm3(vec3 p) { float s = 0.5 * vnoise(p); p = ROT * p * 2.02; s += 0.3 * vnoise(p); p = ROT * p * 2.03; s += 0.2 * vnoise(p); return s; }
float fbm5(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = ROT * p * 2.02; a *= 0.5; } return s / 0.96875; }
`;

// the colours of the oil film on the tunnel walls, as a loop: violet → teal → bronze → violet
const SHEEN = /* glsl */`
vec3 sheen(float t) {
  float x = fract(t) * 3.0;
  vec3 d = abs(x - vec3(0.0, 1.0, 2.0));
  d = min(d, 3.0 - d);                                   // how far round the loop to each colour
  vec3 w = 1.0 - smoothstep(0.0, 1.0, d);                // 1 on a colour, 0 one step away — soft, never a hard edge
  return w.x * vec3(0.50, 0.22, 0.92) + w.y * vec3(0.05, 0.74, 0.70) + w.z * vec3(0.82, 0.52, 0.22);
}
`;

// ═════════════════════════════════════════════════════════════════════════
//  RENDERER
// ═════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('c'), hint = document.getElementById('hint');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' }); }
catch (err) { hint.textContent = 'This scene needs WebGL 2'; hint.classList.add('on'); throw err; }
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.02, 2500);
// the world is drawn into this off-screen picture first, so the lens can bend it afterwards
const rt = new THREE.WebGLRenderTarget(4, 4, { samples: 4, depthBuffer: true, stencilBuffer: true });
// light that can land on top of the ship (its exhaust and sparks, the field's glow, a rip it has flown through) must not
// wipe out the ship's mark in that picture's alpha (see THE LENS), so it is added to the colour only
const KEEP_MARK = { blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor };

// ═════════════════════════════════════════════════════════════════════════
//  SKY — the real one: every star to magnitude 5.6 from the Yale Bright
//  Star Catalogue, fainter ones scattered thicker toward the Milky Way, and
//  NASA's map of the Milky Way behind them. (The catalogue and the pictures
//  are packed at the end of this file; they are the ones in the solar-system page.)
// ═════════════════════════════════════════════════════════════════════════
const packed = id => document.getElementById(id).textContent.trim();
function mapTexture(key, mips, then) {                 // a packed picture as a texture; what kind it is can be read from how it begins
  const b64 = packed('map-' + key), first = b64.charAt(0), tex = new THREE.Texture(), img = new Image();
  img.onload = () => { tex.image = img; tex.needsUpdate = true; if (then) then(img); };
  img.src = 'data:image/' + (first === 'i' ? 'png' : first === 'U' ? 'webp' : 'jpeg') + ';base64,' + b64;
  tex.wrapS = THREE.RepeatWrapping; tex.generateMipmaps = mips; tex.minFilter = mips ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
  if (mips) tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const EPS = rad(23.43928), CE = Math.cos(EPS), SE = Math.sin(EPS);   // how far the Earth's equator leans from the plane of the planets
// the sky's own frame keeps the plane of the planets level, y up
const fromEcliptic = (x, y, z, out) => out.set(x, z, -y);
const fromEquator = (ra, dec, out) => { const a = rad(ra), d = rad(dec), y = Math.cos(d) * Math.sin(a), z = Math.sin(d); return fromEcliptic(Math.cos(d) * Math.cos(a), CE * y + SE * z, -SE * y + CE * z, out); };
const GAL_N = fromEquator(192.85948, 27.12825, V3()), GAL_X = fromEquator(266.40499, -28.93617, V3());   // the galaxy's pole · its centre, in Sagittarius
const GAL_Z = V3().crossVectors(GAL_N, GAL_X);
const sky = new THREE.Group(); sky.rotation.y = Math.PI / 2; scene.add(sky);   // turned so that its north pole is the one this Earth leans toward
const TINT = [[-0.4, .61, .72, 1], [0, .80, .87, 1], [0.3, .97, .97, 1], [0.6, 1, .95, .84], [1.0, 1, .84, .62], [1.5, 1, .72, .46], [2.1, 1, .60, .36]];
const starTint = bv => {                                 // a star's colour from its B−V index: blue-white … orange
  let k = 0; while (k < TINT.length - 2 && bv > TINT[k + 1][0]) k++;
  const t = clamp01((bv - TINT[k][0]) / (TINT[k + 1][0] - TINT[k][0]));
  return [1, 2, 3].map(c => lerp(TINT[k][c], TINT[k + 1][c], t));
};
const BRIGHT = [];                                       // the stars bright enough to leave a streak in the tunnel: where, how bright, what colour
let milkyTex;
const milkyLoaded = new Promise(done => { milkyTex = mapTexture('milkyway', false, done); });
{
  const raw = atob(packed('stars')), nCat = raw.length / 8, FAINT = 9000, n = nCat + FAINT;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n), d = V3(), streaky = [];
  const put = (i, mag, bv) => {                          // one star: how bright (its magnitude) and what colour
    const I = Math.pow(10, -0.18 * (mag - 1)), b = Math.min(1, 0.12 + Math.pow(I, 0.7)), tint = starTint(bv);
    d.multiplyScalar(900).toArray(pos, i * 3);
    size[i] = 1.4 + 2.7 * Math.pow(Math.min(I, 2.8), 0.6);
    for (let c = 0; c < 3; c++) col[i * 3 + c] = tint[c] * b;
  };
  for (let i = 0; i < nCat; i++) {                       // eight bytes a star: where it is (round the plane of the planets, and above it), magnitude, colour, distance
    const by = j => raw.charCodeAt(i * 8 + j);
    const lon = (by(0) | by(1) << 8) / 65536 * Math.PI * 2, lat = ((by(2) | by(3) << 8) / 65535 - 0.5) * Math.PI;
    fromEcliptic(Math.cos(lat) * Math.cos(lon), Math.cos(lat) * Math.sin(lon), Math.sin(lat), d);
    const mag = by(4) / 30 - 1.5, bv = by(5) / 100 - 0.4;
    if (mag < 3.6) BRIGHT.push({ dir: d.clone(), mag, bv });
    if (mag < 4.9) streaky.push(i);
    put(i, mag, bv);
  }
  let seed = 20261004;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = nCat; i < n;) {                           // below the catalogue: stars too faint to have names, thicker toward the Milky Way and its centre
    const z = rnd() * 2 - 1, a = rnd() * 6.2832, r = Math.sqrt(1 - z * z); d.set(r * Math.cos(a), z, r * Math.sin(a));
    const gb = Math.asin(Math.max(-1, Math.min(1, d.dot(GAL_N)))), gl = Math.atan2(d.dot(GAL_Z), d.dot(GAL_X));
    if (rnd() > 0.10 + 0.90 * Math.exp(-Math.abs(gb) / 0.20) * (0.45 + 0.55 * Math.exp(-gl * gl / 1.7))) continue;
    put(i++, 5.7 + 3.0 * Math.sqrt(rnd()), -0.1 + 1.4 * rnd() * rnd() + 0.3 * rnd());
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const stars = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uPx: { value: 1 } },
    vertexShader: `attribute float aSize; attribute vec3 aCol; uniform float uPx; varying vec3 vCol;
      void main() { vCol = aCol; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uPx; }`,
    fragmentShader: `varying vec3 vCol;
      void main() { vec2 q = gl_PointCoord - 0.5; gl_FragColor = vec4(vCol * exp(-dot(q, q) * 18.0), 1.0); }`,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false,
  }));
  stars.frustumCulled = false; stars.renderOrder = -10; stars.name = 'stars';
  // at speed, each brighter star also draws a short line out of itself, pointing away from straight ahead: the sky
  // seems to rush outward from the point the ship is heading for. Each line is a thin strip worked out on the screen.
  const sp = new Float32Array(streaky.length * 12), sc = new Float32Array(streaky.length * 12), corner = new Float32Array(streaky.length * 8),
    sw = new Float32Array(streaky.length * 4), sIdx = [];
  streaky.forEach((i, k) => {
    for (let v = 0; v < 4; v++) {
      for (let c = 0; c < 3; c++) { sp[(k * 4 + v) * 3 + c] = pos[i * 3 + c]; sc[(k * 4 + v) * 3 + c] = col[i * 3 + c]; }
      corner[(k * 4 + v) * 2] = v >> 1; corner[(k * 4 + v) * 2 + 1] = v & 1 ? 1 : -1; sw[k * 4 + v] = 0.3 * size[i];
    }
    sIdx.push(k * 4, k * 4 + 1, k * 4 + 2, k * 4 + 2, k * 4 + 1, k * 4 + 3);
  });
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  sg.setAttribute('aCol', new THREE.BufferAttribute(sc, 3));
  sg.setAttribute('aCorner', new THREE.BufferAttribute(corner, 2));
  sg.setAttribute('aW', new THREE.BufferAttribute(sw, 1));
  sg.setIndex(sIdx);
  const streaks = new THREE.Mesh(sg, new THREE.ShaderMaterial({
    uniforms: { uFwd: { value: V3(0, 0, -1) }, uStreak: { value: 0 }, uPx: stars.material.uniforms.uPx, uRes: { value: new THREE.Vector2(1, 1) } },
    vertexShader: /* glsl */`
      attribute vec3 aCol; attribute vec2 aCorner; attribute float aW;
      uniform vec3 uFwd; uniform float uStreak, uPx; uniform vec2 uRes;
      varying vec3 vCol; varying vec2 vQ;
      void main() {
        vec3 d = normalize(position), tail = normalize(d - uFwd * uStreak);   // pushed away from straight ahead
        vec4 a = projectionMatrix * modelViewMatrix * vec4(d * 900.0, 1.0), b = projectionMatrix * modelViewMatrix * vec4(tail * 900.0, 1.0);
        vCol = aCol; vQ = aCorner;
        if (uStreak < 0.0005 || a.w < 1.0 || b.w < 1.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }   // nothing to draw: put it past the far plane
        vec2 hr = uRes * 0.5, pa = a.xy / a.w * hr, pb = b.xy / b.w * hr, dir = pb - pa;   // in pixels from the middle of the screen
        float len = length(dir); dir = len > 0.01 ? dir / len : vec2(1.0, 0.0);
        float w = aW * uPx;
        vec2 p = mix(pa - dir * w, pb, aCorner.x) + vec2(-dir.y, dir.x) * aCorner.y * w;
        gl_Position = vec4(p / hr, 0.0, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform float uStreak; varying vec3 vCol; varying vec2 vQ;
      void main() { gl_FragColor = vec4(vCol * exp(-vQ.y * vQ.y * 3.0) * pow(1.0 - vQ.x, 1.6) * smoothstep(0.0, 0.03, uStreak) * 0.85, 1.0); }`,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  }));
  streaks.frustumCulled = false; streaks.renderOrder = -9; streaks.name = 'streaks';
  const milky = new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.ShaderMaterial({
    uniforms: { uSky: { value: milkyTex }, uTilt: { value: new THREE.Vector2(CE, SE) } },
    vertexShader: `varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uSky; uniform vec2 uTilt; varying vec3 vDir;

//  in D major (no buzz, no hiss, no pitch that climbs like a siren), in a
//  large soft room. There are two to choose from with the button:
//    chimes  a slow chord that opens as the ship speeds up, a glass note as
//            its field reaches out, a bell at the point, wind chimes as space
//            cracks, a warm bloom going through, three bells at Saturn
//    hum     a quiet low hum, and one singing-bowl note at each rip
//  All of it is made here; nothing is recorded or loaded.
// ═════════════════════════════════════════════════════════════════════════
const sndBtn = document.getElementById('snd');
const MODES = ['chimes', 'hum', 'off'];
const sound = { ctx: null, mode: 'chimes', last: 'chimes', at: -1 };
try { const m = localStorage.getItem('wormhole-sound'); if (MODES.includes(m)) sound.mode = m; } catch (err) {}   // (an older "on" means chimes)
function soundSet(mode) {
  const S = sound; S.mode = mode; if (mode !== 'off') S.last = mode;
  sndBtn.textContent = 'Sound: ' + mode;
  try { localStorage.setItem('wormhole-sound', mode); } catch (err) {}
  if (!S.ctx) return;
  const now = S.ctx.currentTime;
  S.out.gain.setTargetAtTime(mode === 'off' ? 0 : 0.8, now, 0.08);
  for (const k in S.moods) S.moods[k].g.gain.setTargetAtTime(k === mode ? 1 : 0, now, 0.4);   // one fades out as the other fades in
}
soundSet(sound.mode);
sndBtn.addEventListener('click', () => { soundSet(MODES[(MODES.indexOf(sound.mode) + 1) % MODES.length]); sndBtn.blur(); });

const midi = n => 440 * Math.pow(2, (n - 69) / 12);     // a note's number → its pitch (62 is the D above middle C)
function soundStart() {                                  // a browser only lets a page make sound once it has been pressed
  const S = sound;
  if (S.ctx) { S.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = S.ctx = new AC(), bus = ctx.createGain(), squash = ctx.createDynamicsCompressor(), out = S.out = ctx.createGain();
  squash.threshold.value = -16; squash.knee.value = 18; squash.ratio.value = 3; squash.attack.value = 0.02; squash.release.value = 0.4;   // gentle: it only catches peaks
  bus.connect(squash); squash.connect(out); out.connect(ctx.destination);
  out.gain.value = S.mode === 'off' ? 0 : 0.8;
  S.meter = ctx.createAnalyser(); squash.connect(S.meter);           // read before the volume, so it can be measured while muted
  // the room: an echo made here, a burst that dies away over about three seconds, darker as it goes
  const len = Math.floor(ctx.sampleRate * 3.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c); let y = 0;
    for (let i = 0; i < len; i++) { y += (Math.random() * 2 - 1 - y) * (0.5 - 0.44 * i / len); d[i] = i < ctx.sampleRate * 0.02 ? 0 : y * Math.exp(-i / ctx.sampleRate * 2.2); }
  }
  const room = ctx.createConvolver(), send = S.send = ctx.createGain(), wet = S.wet = ctx.createGain();
  room.buffer = ir; wet.gain.value = 0.35; send.connect(room); room.connect(wet); wet.connect(bus);
  S.moods = { chimes: makeChimes(ctx, bus, send), hum: makeHum(ctx, bus, send) };
  for (const k in S.moods) S.moods[k].g.gain.value = k === S.mode ? 1 : 0;
  // what happens when, on the trip's own clock: [when, what, …] — each sound answers the ones it has a voice for
  S.cues = [
    [T_FIELD, 'field', 0.4 + T_RIP_A - T_FIELD],
    [T_RIP_A, 'point', 0], [T_RIP_A + 0.6 / RIP_A_RATE, 'cracks', 1.7 / RIP_A_RATE, 0], [T_RIP_A + RIP_PEEL / RIP_A_RATE, 'peel', (RIP_OPEN - RIP_PEEL) / RIP_A_RATE],
    [T_A - 0.1, 'through', 0],
    [T_RIP_B, 'point', 1], [T_RIP_B + 0.6 / RIP_B_RATE, 'cracks', 1.7 / RIP_B_RATE, 1], [T_RIP_B + RIP_PEEL / RIP_B_RATE, 'peel', (RIP_OPEN - RIP_PEEL) / RIP_B_RATE],
    [T_B - 0.1, 'through', 1],
    [T_PULL + 0.8, 'arrive'],
  ];
}

// the pieces both sounds are built from
function tone(dest, when, f, gain, attack, decay) {      // one note that is struck and dies away, like a bell's partial
  const ctx = sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = f;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(gain, when + attack); g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
  o.connect(g); g.connect(dest); o.start(when); o.stop(when + attack + decay + 0.05);
}
function bell(dest, when, f, gain, decay) {              // a soft-headed bell: a few partials, the higher ones dying sooner
  [[1, 1, 1], [2, 0.32, 0.6], [3, 0.14, 0.4], [4.2, 0.05, 0.25]].forEach(([r, k, d]) => tone(dest, when, f * r, gain * k, 0.012, decay * d));
}
function bowl(dest, when, f, gain, decay) {              // a singing bowl: its partials are not whole multiples, and each is two a breath apart, so it wavers
  [[1, 1, 1], [2.76, 0.45, 0.6], [5.4, 0.18, 0.35]].forEach(([r, k, d]) => { tone(dest, when, f * r, gain * k * 0.6, 0.03, decay * d); tone(dest, when, f * r + 0.6, gain * k * 0.4, 0.03, decay * d); });
}
function swell(dest, when, notes, gain, attack, hold, release) {   // notes that rise softly, stay, and fade
  const ctx = sound.ctx;
  for (const n of notes) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = midi(n);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(gain, when + attack); g.gain.setValueAtTime(gain, when + attack + hold); g.gain.linearRampToValueAtTime(0, when + attack + hold + release);
    o.connect(g); g.connect(dest); o.start(when); o.stop(when + attack + hold + release + 0.05);
  }
}
function voice(ctx, dest, f, parts) {                    // a held note: a few oscillators into one gain the bed can raise and lower
  const v = ctx.createGain(); v.gain.value = 0; v.connect(dest);
  for (const [type, df, mix] of parts) { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = type; o.frequency.value = f + df; og.gain.value = mix; o.connect(og); og.connect(v); o.start(); }
  return v;
}
function outlet(ctx, bus, send) {                        // where a sound goes: straight out, and into the room
  const g = ctx.createGain(); g.connect(bus); g.connect(send); return g;
}

// CHIMES
function makeChimes(ctx, bus, send) {
  const g = outlet(ctx, bus, send), lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 450; lp.Q.value = 0.4; lp.connect(g);
  // the chord, D A D E F♯ A: the low notes from the moment the engines light, the high ones opening in as the speed builds.
  // Each breathes on its own slow cycle, so the chord is never quite still.
  const voices = [[38, 0.9, 0], [50, 0.6, 0], [57, 0.45, 0], [64, 0.3, 1], [66, 0.26, 1], [69, 0.22, 1]].map(([n, level, high], i) => {
    const breath = ctx.createGain(), lfo = ctx.createOscillator(), depth = ctx.createGain();
    breath.gain.value = 1; breath.connect(lp);
    lfo.frequency.value = 0.05 + 0.031 * i; depth.gain.value = 0.3; lfo.connect(depth); depth.connect(breath.gain); lfo.start();
    return { v: voice(ctx, breath, midi(n), [['sine', -0.12 * (i + 1), 0.7], ['triangle', 0.12 * (i + 1), 0.3]]), level, high };
  });
  return {
    g,
    step(now, { t, going, thr, deep, settle }) {
      const low = going ? thr * (1 - 0.4 * settle) : 0, high = going ? ss(0.4, T_ACC, t) * (1 - 0.7 * settle) : 0;
      for (const { v, level, high: h } of voices) v.gain.setTargetAtTime(0.06 * level * (h ? high : low), now, 0.6);
      lp.frequency.setTargetAtTime((450 + 650 * ss(0, T_ACC, t) + 450 * deep) * (1 - 0.45 * settle), now, 0.5);
    },
    field(now, dur) { swell(g, now, [81, 86], 0.014, 0.8, Math.max(0, dur - 0.8), 1.8); },                         // a glass note, as the field reaches out
    point(now, far) { bell(g, now, midi(far ? 69 : 74), 0.06, 3.5); },                                              // a bell, at the point
    cracks(now, span, far) {                                                                                       // wind chimes, as space cracks
      const notes = far ? [62, 64, 66, 69, 71, 74] : [74, 76, 78, 81, 83, 86];
      for (let i = 0; i < 8; i++) bell(g, now + span * (i + 0.6 * Math.random()) / 8, midi(notes[Math.floor(Math.random() * notes.length)]), 0.012 + 0.014 * Math.random(), 1.8);
    },
    peel(now, dur) { swell(g, now, [78, 81, 86], 0.009, dur, 0.2, 1.4); },                                          // a shimmer rising as it opens
    through(now, far) { swell(g, now, [38, 50], 0.035, 0.25, 0.3, 2.6); bell(g, now, midi(far ? 57 : 62), 0.035, 4.5); },   // a warm bloom, going through
    arrive(now) { [62, 69, 78].forEach((n, i) => bell(g, now + 0.4 * i, midi(n), 0.04 - 0.005 * i, 4.5)); },        // three bells, at Saturn
  };
}

// HUM
function makeHum(ctx, bus, send) {
  const g = outlet(ctx, bus, send), lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 500; lp.Q.value = 0.3; lp.connect(g);
  // D and the D above it (high enough for a phone's speaker), each with a faint twin a quarter of a hertz off, so the hum
  // breathes a little, slowly; the A between them comes in inside the tunnel. Its pitch never moves.
  const base = voice(ctx, lp, midi(50), [['sine', 0, 0.85], ['sine', 0.25, 0.15]]);
  const oct = voice(ctx, lp, midi(62), [['sine', 0, 0.85], ['sine', -0.25, 0.15]]);
  const fifth = voice(ctx, lp, midi(57), [['sine', 0, 1]]);
  return {
    g,
    step(now, { going, thr, deep, seen, settle }) {
      const k = going ? (0.03 + 0.035 * thr) * (0.35 + 0.65 * seen) * (1 - 0.5 * settle) : 0;   // fades as the ship flies off
      base.gain.setTargetAtTime(k, now, 0.5); oct.gain.setTargetAtTime(k * 0.5, now, 0.5); fifth.gain.setTargetAtTime(k * 0.3 * deep, now, 0.8);
      lp.frequency.setTargetAtTime(500 + 250 * thr, now, 0.5);
    },
    point(now, far) { bowl(g, now, midi(far ? 57 : 62), 0.06, 6); },                                               // one singing-bowl note at each rip
    through(now) { swell(g, now, [50], 0.03, 0.3, 0.2, 2.5); },
    arrive(now) { bowl(g, now, midi(62), 0.045, 7); },
  };
}

function soundStep(t, going, thr, boost, deep, seen) {   // every frame: the beds follow the trip, and anything due on the clock is struck
  const S = sound; if (!S.ctx) return;
  const now = S.ctx.currentTime, from = S.at; S.at = going ? t : -1;
  const p = { t, going, thr, boost, deep, seen, settle: going ? ss(T_PULL, T_DONE, t) : 0 };
  for (const k in S.moods) S.moods[k].step(now, p);
  S.wet.gain.setTargetAtTime(0.35 + 0.3 * deep, now, 0.4);              // the room grows inside the tunnel
  if (!going || t < from || t - from > 0.5) return;      // not flying, or the clock jumped (a replay): nothing is due
  const m = S.moods[S.mode]; if (!m) return;             // off: nothing to strike
  for (const [at, what, ...args] of S.cues) if (from < at && at <= t && m[what]) m[what](now, ...args);
}

// ═════════════════════════════════════════════════════════════════════════
//  THE LENS — the finished picture, bent around the mouth on its way to the screen
// ═════════════════════════════════════════════════════════════════════════
const post = {
  tScene: { value: rt.texture }, uAspect: { value: 1 }, uLensC: { value: new THREE.Vector2(0.5, 0.5) }, uLensR: { value: 0.1 }, uLensK: { value: 0 },
  uRipple: { value: 1 }, uWarp: { value: 0 }, uFlash: { value: 0 }, uFade: { value: 0 }, uTime: { value: 0 }, uGlass: { value: 0 },
  uNoseC: { value: new THREE.Vector2(0.5, 0.4) }, uRodW: { value: new THREE.Vector2(0.01, 0.05) }, uRod: { value: 0 }, uRodReach: { value: 0 },
};
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
{
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: post,
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tScene; uniform vec2 uLensC; uniform float uAspect, uLensR, uLensK, uRipple, uWarp, uFlash, uFade, uTime, uGlass;
      uniform vec2 uNoseC, uRodW; uniform float uRod, uRodReach;
      varying vec2 vUv;
      // For a pixel on screen, where in the un-bent picture should its colour come from?
      vec2 bend(vec2 uv, float k) {
        vec2 q = (uv - uLensC) * vec2(uAspect, 1.0);
        float r = length(q), x = r / uLensR;                              // x = 1 on the rim
        if (x > 4.6) return uv;
        float off;
        if (x < 1.0) off = -0.16 * x * (1.0 - x * x);                     // inside the mouth: a gentle magnifying glass
        else {
          float t = x - 1.0;
          off = -2.3 * t * t * exp(-2.5 * t);                             // outside: the sky is pulled in toward the rim, most at ~1.8 radii, nothing by ~4
          float wave = t - uRipple * 4.0;                                 // and one ripple runs outward when the rip comes fully open
          off += 0.16 * sin(wave * 9.0) * exp(-wave * wave * 4.8) * (1.0 - uRipple) * smoothstep(0.0, 0.08, uRipple) * smoothstep(0.0, 0.25, t);
          off *= 1.0 - smoothstep(3.2, 3.5, t);
        }
        // while the ship's field holds space ahead of it, the bend is not still: it shimmers like poured glass, in slow
        // waves running out from the middle, wobbling as they go round
        float ang = atan(q.y, q.x);
        off += uGlass * 0.25 * sin(x * 5.5 - uTime * 5.0 + 1.6 * sin(ang * 3.0 + uTime * 1.7)) * exp(-abs(x - 1.0) * 0.9) * smoothstep(0.35, 1.0, x) * (1.0 - smoothstep(3.6, 4.5, x));
        return uv + q / max(r, 1e-6) * (off * k * uLensR) / vec2(uAspect, 1.0);
      }
      // The ship's field, from its nose (uNoseC) out to the point ahead where it grips space (uLensC): a rod of glass.
      // Seen through it, the view across it is turned over and squeezed toward the middle, and ripples run along it,
      // outward from the ship. It returns how far to move this pixel's look-up; rim is how much of its edge is here.
      vec2 rod(vec2 uv, out float rim) {
        rim = 0.0;
        vec2 sc = vec2(uAspect, 1.0), a = uNoseC * sc, ab = uLensC * sc - a;
        float L = length(ab);
        if (uRod < 0.002 || L < 1e-4) return vec2(0.0);
        vec2 dir = ab / L, nrm = vec2(-dir.y, dir.x), p = uv * sc - a;
        float u = dot(p, dir) / L, w = mix(uRodW.x, uRodW.y, clamp(u, 0.0, 1.0)), x = dot(p, nrm) / w;   // u: 0 at the nose, 1 at the point · x: -1 … 1 across
        float along = smoothstep(-0.02, 0.15, u) * (1.0 - smoothstep(uRodReach - 0.12, uRodReach, u)) * (1.0 - smoothstep(0.6, 0.85, u));   // it grows out from the nose, and leaves the point itself clear
        float k = along * (1.0 - smoothstep(0.8, 1.0, abs(x))) * uRod;
        rim = along * exp(-pow((abs(x) - 0.88) / 0.10, 2.0)) * uRod;
        float off = -0.85 * x * (1.0 - x * x) + 0.22 * (1.0 - x * x) * sin(u * L * 70.0 - uTime * 11.0);
        return nrm * off * w * k / sc;
      }
      // The ship is in front of all this bending, not behind it: the scene marks it with alpha 0. A look-up that lands on
      // the ship takes what is unbent here instead, so no bent copy of it appears, and the ship itself is drawn as it is.
      vec4 here;
      vec3 seen(vec2 uv) { vec4 s = texture2D(tScene, uv); return mix(here.rgb, s.rgb, smoothstep(0.2, 0.8, s.a)); }
      void main() {
        vec2 c = vUv - 0.5;
        here = texture2D(tScene, vUv);
        float rim; vec2 ro = rod(vUv, rim);
        vec3 col;
        if (uLensK > 0.002) {                                             // glass bends each colour a little differently
          col = vec3(seen(bend(vUv + ro * 0.9, uLensK * 0.90)).r, seen(bend(vUv + ro, uLensK)).g, seen(bend(vUv + ro * 1.1, uLensK * 1.10)).b);
        } else {                                                          // in the tunnel: a trace of colour fringe toward the edges, for speed
          float w = uWarp * dot(c, c) * 0.05;
          col = vec3(seen(vUv + ro * 0.9 - c * w).r, seen(vUv + ro).g, seen(vUv + ro * 1.1 + c * w).b);
        }
        col = mix(col, here.rgb, 1.0 - here.a);
        col += vec3(0.30, 0.90, 0.85) * rim * 0.07;                       // the rod's edges catch a little light
        col += uFlash * vec3(0.80, 0.72, 1.0) * (1.0 - 0.6 * length(c));
        col *= 1.0 - 0.30 * smoothstep(0.35, 0.78, length(c));
        col += (fract(sin(dot(gl_FragCoord.xy + fract(uTime) * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;   // grain, so dark glows don't band
        gl_FragColor = vec4(col * uFade, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  }));
  quad.frustumCulled = false; postScene.add(quad);
}

// ═════════════════════════════════════════════════════════════════════════
//  SIZE, and a quiet step down in sharpness if the laptop can't keep up
// ═════════════════════════════════════════════════════════════════════════
let baseFov = 50;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false);
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(db.x, db.y);
  camera.aspect = w / h; post.uAspect.value = w / h;
  baseFov = Math.max(50, 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(rad(32)) / camera.aspect)));   // on a tall phone, widen so Earth and the mouth both fit
  sky.getObjectByName('stars').material.uniforms.uPx.value = pixelRatio * Math.min(1.5, Math.max(0.85, h / 820));
  sky.getObjectByName('streaks').material.uniforms.uRes.value.set(db.x, db.y);
}
addEventListener('resize', resize); resize();
let slow = 0;
function govern(dt) {
  slow = dt > 1 / 45 ? slow + 1 : Math.max(0, slow - 2);
  if (slow > 75 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); slow = 0; resize(); }
}

// ═════════════════════════════════════════════════════════════════════════
//  THE TRIP — everything on screen is worked out from one clock, `trip`
// ═════════════════════════════════════════════════════════════════════════
const query = new URLSearchParams(location.search);
let time = 0, trip = query.has('t') ? +query.get('t') : -1, fade = 0, phase = '', frameDt = 0;   // trip < 0: waiting by Earth
const hold = query.has('hold');                                                     // ?t=14&hold freezes a moment to look at
const touch = matchMedia('(pointer: coarse)').matches;

const _p = V3(), _a = V3(), _d = V3(), _d2 = V3(), _q = V3(), _t = V3(), _up = V3(), _fwd = V3(), _skyQinv = sky.quaternion.clone().invert();
function upAt(s, out) {
  const sc = Math.min(Math.max(s, 0), S_END), x = sc / FR_STEP, i = Math.min(Math.floor(x), FR_N - 1), f = x - i;
  out.set(lerp(frameUp[i * 3], frameUp[i * 3 + 3], f), lerp(frameUp[i * 3 + 1], frameUp[i * 3 + 4], f), lerp(frameUp[i * 3 + 2], frameUp[i * 3 + 5], f)).normalize();
  const roll = ROLL_FIX * ss(S_A + 3, S_B - 8, s) + 0.55 * Math.sin((s - S_A) * 0.11) * ss(S_A + 2, S_A + 14, s) * (1 - ss(S_B - 22, S_B - 8, s));
  path.getTangentAt(sc / S_END, _t); _q.crossVectors(_t, out);
  return out.multiplyScalar(Math.cos(roll)).addScaledVector(_q, Math.sin(roll));
}

function update() {
  const going = trip >= 0, t = going ? trip : 0, s = going ? sAt(t) : 0;
  const inTube = s > S_A - 0.08 && s < S_B;
  const tauA = (t - T_RIP_A) * RIP_A_RATE, openA = going ? ss(RIP_PEEL, RIP_OPEN, tauA) : 0;   // the near rip's own clock, and how open it is
  steerStep(frameDt, t, s, going);
  const deep = ss(S_A - 0.8, S_A + 9, s) * (1 - ss(S_B - 9, S_B + 4, s));            // 1 well inside the tunnel, 0 outside
  // the launch: how far into top speed it is; as it builds, the camera falls back (same angle, so the ship stays low-centre)
  const speed = going ? ss(0.15, 1, (sAt(t + 0.05) - s) / 0.05 / V_TOP) * (1 - ss(S_A - 0.5, S_A + 8, s)) : 0;
  shipDrop = SHIP_DROP * (1 + PULL * speed); shipLead = SHIP_LEAD * (1 + PULL * speed) * (1 - 0.26 * deep);   // a little closer in the tunnel, where the view is wider

  // where the camera is
  pathPos(s, _p);
  pathPos(s + lerp(1.0, 3.2, ss(S_A, S_A + 10, s)), _a);
  _d2.subVectors(_a, _p).normalize();                                                // the way ahead
  const sway = 1 - ss(0, 2, s);
  _p.x += Math.sin(time * 0.23) * 0.05 * sway; _p.y += Math.sin(time * 0.17 + 1.3) * 0.035 * sway;
  const k = smoother(clamp01((t - T_PULL) / PULL_DUR));
  if (k > 0) _p.add(pullArc(k, _q)).sub(E);                                          // the pull-back
  const rest = ss(T_PULL + PULL_DUR * 0.7, T_DONE + 3, t);
  _p.addScaledVector(RIGHT_FIN, Math.sin(time * 0.11) * 0.9 * rest).addScaledVector(Y, Math.sin(time * 0.083 + 2) * 0.6 * rest);
  camera.position.copy(_p);

  // where it looks: Earth → swinging onto the way ahead as the ship sets off → Saturn
  _d.subVectors(LOOK0, _p).normalize().lerp(_d2, ss(0.1, 2.6, s)).normalize();
  _d.lerp(_d2.subVectors(SAT_POS, _p).normalize(), ss(S_B - 4, S_B + 5, s)).normalize();
  const level = 1 - ss(S_A - 1.2, S_A + 2.5, s) * (1 - ss(S_B - 3, S_B + 4, s));     // level outside, free to roll inside
  camera.up.copy(upAt(s, _up).lerp(Y, level).normalize());

    hint.textContent = now === 'idle' ? (touch ? 'Tap to travel' : 'Tap or press Space to travel') : now === 'done' ? (touch ? 'Tap to travel again' : 'Press R to travel again')

}

function start() { if (trip >= 0) fade = 0; trip = 0; soundStart(); }                               // a replay cuts back to Earth, so it fades in
// A press starts the trip when we are waiting by Earth or have arrived; mid-trip it does nothing. It is judged by the
// clock itself, so it cannot be a frame out of date, and that also makes the several events one tap sends count once.
const press = e => { if (e && e.target === sndBtn) return; if (trip < 0 || trip >= T_DONE - 1.5) start(); };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(Arrow(Up|Down|Left|Right)|Key[WASD])$/.test(e.code)) { e.preventDefault(); steer.keys.add(e.code); return; }
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); press(); }
  else if (e.code === 'KeyM') soundSet(sound.mode === 'off' ? sound.last : 'off');
  else if (e.code === 'KeyR') start();
});
// anywhere on the page, and by whichever event the browser sends for a tap: not all of them send every one
for (const type of ['pointerdown', 'touchstart', 'mousedown', 'click']) addEventListener(type, press, { passive: true });

  get moons() {                                          // where each moon is on the screen right now: x, y (0…1 from the top-left) and its size in pixels
    const at = moonPts.geometry.attributes.position, sz = moonPts.geometry.attributes.aSize, v = V3(), out = [];
    for (let i = 0; i < at.count; i++) {
      v.fromBufferAttribute(at, i).applyMatrix4(moonPts.matrixWorld); const far = v.distanceTo(camera.position); v.project(camera);
      out.push([+(v.x * 0.5 + 0.5).toFixed(3), +(0.5 - v.y * 0.5).toFixed(3), +(sz.getX(i) * moonPts.material.uniforms.uScale.value / far).toFixed(1), v.z < 1]);

let last = performance.now();
function loop(now) {

  const raw = (now - last) / 1000, dt = Math.min(raw, 0.1); last = now;
  time += dt; fade += dt; frameDt = dt; if (trip >= 0 && !hold) trip += dt;
  update();
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  if (raw < 0.25) govern(raw);
