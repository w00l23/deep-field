<style>
  :root{
    --ink:#ece8f4;
    --dim:rgba(214,208,236,.74);
    --soft:rgba(214,208,236,.56);
    --gold:255,214,160;

  *{box-sizing:border-box}

  #intro h1{margin:0;font-weight:normal;font-size:.95rem;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;

  #tour:hover,#tour:focus-visible{color:rgba(240,236,255,.92);outline:none}
  #tour:focus-visible{outline:2px solid rgba(220,215,255,.8);outline-offset:-6px;border-radius:10px}

  /* what you are looking at, and how wide the screen is right now */
  #hud{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:0 18px calc(14px + var(--sab));

<body>
<canvas id="view" aria-label="A zoom through the sizes of things, from an atom to the observable universe"></canvas>

<div id="intro">
  <h1>Scale Zoom</h1>
  <p>Everything here is drawn at its true size. Scroll, pinch or drag to travel, or let the tour carry you.</p>
</div>

<button id="tour" type="button" aria-pressed="true">pause</button>

<div id="hud">
  <div id="label"><h2 id="name"></h2><p id="size"></p><p id="fact"></p></div>
  <div id="across"></div>
  <div id="track" role="slider" tabindex="0" aria-label="Scale" aria-valuemin="0" aria-valuemax="18" aria-valuenow="6"><i id="mark"></i></div>
  <div id="ends" aria-hidden="true"><span>atom</span><span>universe</span></div>
</div>

<script>
/* Scale Zoom. One camera, one number: z, the log of how many metres the
   screen's short side spans right now. Everything is placed in one world, in
   metres, with you standing at the origin, and drawn at its true size for that z.
   Bigger things sit around their own centres (the Earth's, the Sun's, the
   galaxy's...), so as you zoom out the camera eases from one centre to the
   next and the thing you came from slides a little aside. */
(() => {
  const cv = document.getElementById('view');
  const c = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- units ---------------------------------------------------------------
  const AU = 1.495978707e11, LY = 9.4607e15, R_E = 6.371e6;

  // a soft, seeded random so the sky is the same each visit
  const rng = s => () => ((s = (s + 0x6D2B79F5) >>> 0, s = Math.imul(s ^ s >>> 15, s | 1),
    s ^= s + Math.imul(s ^ s >>> 7, s | 61), ((s ^ s >>> 14) >>> 0) / 4294967296));
  const ss = (a, b, x) => x <= a ? 0 : x >= b ? 1 : ((x = (x - a) / (b - a)), x * x * (3 - 2 * x));
  const norm = (x, y) => { const l = Math.hypot(x, y); return [x / l, y / l]; };
  const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];

  // ---- where the big things are (metres, you at 0,0, y pointing down) ---------
  const dSun = norm(-0.94, 0.34);                  // from Earth towards the Sun
  const C_EARTH = [-0.30 * R_E, 0.22 * R_E];        // we look down on Earth's night side
  const C_SUN = add(C_EARTH, dSun, AU);
  const dGal = norm(0.55, -0.83);
  const C_GAL = add(C_SUN, dGal, 26000 * LY);       // the Milky Way's centre
  const dAnd = norm(0.88, 0.47);
  const C_AND = add(C_GAL, dAnd, 2.5e6 * LY);       // Andromeda
  const C_LG = add(C_GAL, dAnd, 1.2e6 * LY);        // the Local Group's middle, roughly
  const C_LAN = add(C_LG, norm(-0.62, -0.78), 250e6 * LY);   // Laniakea's heart, the Great Attractor

  // camera: each step hands over from a centre to the next one out
  const CHAIN = [
    { v: C_EARTH },
    { v: add(C_SUN, C_EARTH, -1) },
    { v: add(C_GAL, C_SUN, -1) },
    { v: add(C_LG, C_GAL, -1) },
    { v: add(C_LAN, C_LG, -1) },
    { v: [-C_LAN[0], -C_LAN[1]], L: 26.2 },        // the observable universe is centred on us
  ];
  for (const k of CHAIN) { k.D = Math.hypot(k.v[0], k.v[1]); if (k.L == null) k.L = Math.log10(k.D); }
  function focus(z) {
    let fx = 0, fy = 0;
    for (const k of CHAIN) {
      const u = z - k.L;
      const s = Math.min(1, 0.3 * ss(-1.4, -0.4, u) * Math.pow(10, u));
      fx += s * k.v[0]; fy += s * k.v[1];
    }
    return [fx, fy];
  }

  // ---- the stops: what the tour pauses on -----------------------------------------
  const STOPS = [
    { id: 'atom', z: -9.66, name: 'A hydrogen atom', size: '0.1 nanometres across', fact: 'Its nucleus is 60,000 times smaller still.' },
    { id: 'dna', z: -8.22, name: 'DNA', size: '2 nanometres wide', fact: 'Unwound, the DNA in one of your cells would stretch about 2 metres.' },
    { id: 'virus', z: -6.66, name: 'A flu virus', size: 'about 100 nanometres', fact: 'Too small for any light microscope to see.' },
    { id: 'cell', z: -4.62, name: 'Red blood cells', size: 'about 7.5 micrometres', fact: 'You carry about 25 trillion of them.' },
    { id: 'hair', z: -3.4, name: 'A human hair', size: 'about 0.07 millimetres thick', fact: 'Its surface is covered in tiny overlapping scales.' },
    { id: 'snow', z: -2.26, name: 'A snowflake', size: 'about 3 millimetres', fact: 'All six arms grew in the same air, so they match.' },
    { id: 'you', z: 0.5, name: 'You', size: 'about 1.7 metres', fact: 'The gold dot will keep your place all the way out.' },
    { id: 'city', z: 4.7, name: 'A city at night', size: 'about 30 kilometres', fact: '' },
    { id: 'earth', z: 7.38, name: 'Earth', size: '12,742 kilometres across', fact: 'Home to everyone you have ever met.' },
    { id: 'moon', z: 9.15, name: 'The Moon’s orbit', size: '769,000 kilometres across', fact: 'Light crosses it in about two and a half seconds.' },
    { id: 'orbit', z: 11.7, name: 'Earth’s orbit', size: '300 million kilometres across', fact: 'Sunlight takes 8 minutes and 20 seconds to reach us.' },
    { id: 'planets', z: 13.06, name: 'The planets', size: 'out to Neptune, 9 billion kilometres across', fact: 'Voyager 2 took twelve years to get to Neptune.' },
    { id: 'oort', z: 16.45, name: 'The Oort cloud', size: 'perhaps 3 light-years across', fact: 'A far shell of icy bodies that no one has seen directly.' },
    { id: 'stars', z: 17.38, name: 'Our nearest stars', size: 'Alpha Centauri, 4.4 light-years away', fact: 'Its light set out about four years ago.' },
    { id: 'hood', z: 19.3, name: 'Our neighbourhood', size: 'about 2,000 light-years across', fact: 'Most of the stars you can see at night are in here.' },
    { id: 'galaxy', z: 21.15, name: 'The Milky Way', size: 'about 100,000 light-years across', fact: 'We sit about 26,000 light-years from its centre.' },
    { id: 'group', z: 22.6, name: 'The Local Group', size: 'about 10 million light-years', fact: 'Andromeda is falling towards us at about 110 kilometres a second.' },
    { id: 'lan', z: 24.95, name: 'Laniakea, our supercluster', size: 'about 520 million light-years', fact: 'Its name is Hawaiian for “immeasurable heaven”.' },
    { id: 'all', z: 27.17, name: 'The observable universe', size: '93 billion light-years across', fact: 'You are at its centre, and so is everyone else.' },
  ];
  const Z_MIN = -10.1, Z_MAX = 27.5, YOU = 6;

  // ---- things to draw -------------------------------------------------------------
  // each: pos (metres), size (metres across), r = size / screen, fades in and out by r
  // (or by z, for things that are a cloud rather than one object)
  const R = rng(20261105);
  const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += R(); return (u - 3) / 1.4; };

  // the electron's cloud, sampled from the real 1s distribution r^2 e^(-2r)
  const atomPts = Array.from({ length: 700 }, () => {
    const r = -0.5 * (Math.log(R()) + Math.log(R()) + Math.log(R())), a = R() * 6.283;
    return [Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, R() * 6.283];
  });
  const cityPts = [];
  for (let i = 0; i < 1100; i++) { const r = Math.abs(gauss()) * 0.17, a = R() * 6.283; cityPts.push([Math.cos(a) * r, Math.sin(a) * r * 0.8, R()]); }
  for (let k = 0; k < 9; k++) {                    // roads: lights strung out along lines
    const a = R() * 3.14, ox = gauss() * 0.06, oy = gauss() * 0.06;
    for (let i = 0; i < 70; i++) { const t = (R() - 0.5) * (0.5 + R() * 0.6); cityPts.push([ox + Math.cos(a) * t, oy + Math.sin(a) * t, R() * 0.6]); }
  }
  const planets = [ // AU, colour, radius in km
    [0.387, '200,190,180', 2440], [0.723, '240,220,180', 6052], [1, '120,170,255', 6371], [1.524, '230,130,90', 3390],
    [5.203, '230,200,160', 69911], [9.537, '235,215,165', 58232], [19.19, '170,225,235', 25362], [30.07, '120,150,250', 24622]];
  const earthAng = Math.atan2(C_EARTH[1] - C_SUN[1], C_EARTH[0] - C_SUN[0]);
  const planetAng = planets.map((p, i) => i === 2 ? earthAng : R() * 6.283);
  const kuiper = Array.from({ length: 500 }, () => { const r = (39 + gauss() * 4) * AU, a = R() * 6.283; return [Math.cos(a) * r, Math.sin(a) * r]; });
  const oortPts = Array.from({ length: 1100 }, () => { const r = Math.pow(10, 15.1 + R() * 1.1), a = R() * 6.283; return [Math.cos(a) * r, Math.sin(a) * r * 0.92, R()]; });
  const NEAR = [ // name, light-years, colour, show name
    ['Alpha Centauri', 4.37, '255,236,200', 1], ['Barnard’s Star', 5.96, '255,170,130', 1], ['Wolf 359', 7.86, '255,150,120', 0],
    ['Lalande 21185', 8.31, '255,170,140', 0], ['Sirius', 8.6, '210,225,255', 1], ['Luyten 726-8', 8.79, '255,150,120', 0],
    ['Ross 154', 9.7, '255,160,130', 0], ['Epsilon Eridani', 10.5, '255,210,170', 1], ['Procyon', 11.46, '240,240,255', 1],
    ['61 Cygni', 11.4, '255,190,150', 0], ['Tau Ceti', 11.9, '255,225,190', 1], ['Epsilon Indi', 11.87, '255,200,150', 0]]
    .map(([n, d, col, show]) => { const a = R() * 6.283; return { n, x: Math.cos(a) * d * LY, y: Math.sin(a) * d * LY, col, show }; });
  const field = Array.from({ length: 1500 }, () => {      // as many stars on screen at any zoom: spread evenly in log distance
    const r = Math.pow(10, 16.9 + R() * 3.6), a = R() * 6.283, w = R();
    return [Math.cos(a) * r, Math.sin(a) * r, w, w < 0.12 ? '190,210,255' : w > 0.85 ? '255,200,150' : '255,245,230'];
  });

  // a spiral galaxy as points, in units of its radius
  function galaxy(seed, n, arms, wind) {
    const g = rng(seed), gs = () => { let u = 0; for (let i = 0; i < 6; i++) u += g(); return (u - 3) / 1.4; };
    const pts = [];
    for (let i = 0; i < n; i++) {
      let x, y, col;
      if (g() < 0.2) {                              // the bulge
        const r = Math.abs(gs()) * 0.09, a = g() * 6.283; x = Math.cos(a) * r; y = Math.sin(a) * r * 0.8; col = 0;
      } else {
        const t = Math.pow(g(), 0.7), r = 0.08 + 0.92 * t;
        const a = (Math.floor(g() * arms) / arms) * 6.283 + Math.log(r / 0.08) * wind + gs() * (0.18 + 0.1 * t);
        const j = gs() * 0.025;
        x = Math.cos(a) * r + j; y = Math.sin(a) * r + j; col = g() < 0.12 ? 3 : t < 0.35 ? 1 : 2;
      }
      pts.push(x, y, col, g());
    }
    return pts;
  }
  const GCOL = ['255,220,170', '255,236,205', '200,215,255', '255,160,190'];
  const mw = galaxy(7, 8000, 4, 2.1), and = galaxy(31, 4200, 2, 2.6), tri = galaxy(33, 1200, 2, 1.6);

  // the cosmic web: knots joined to their nearest neighbours
  function web(seed, n, centre) {
    const g = rng(seed), pts = [];
    for (let i = 0; i < n; i++) {
      const r = (centre ? Math.pow(g(), 0.8) : Math.sqrt(g())), a = g() * 6.283;
      pts.push([Math.cos(a) * r, Math.sin(a) * r, g()]);
    }
    const edges = [];
    for (let i = 0; i < n; i++) {
      const d = [];
      for (let j = 0; j < n; j++) if (j !== i) d.push([(pts[i][0] - pts[j][0]) ** 2 + (pts[i][1] - pts[j][1]) ** 2, j]);
      d.sort((a, b) => a[0] - b[0]);
      for (let k = 0; k < 3; k++) if (d[k][1] > i || k === 0) edges.push(i, d[k][1]);
    }
    return { pts, edges };
  }
  const lan = web(55, 420, true), cosmos = web(77, 1700, false);
  const cmb = Array.from({ length: 900 }, () => { const a = R() * 6.283; return [a, R(), R()]; });

  // ---- drawing helpers ---------------------------------------------------------------
  let W = 0, H = 0, S = 0, CY = 0, dpr = 1, t = 0, tw = 0;   // t: the clock; tw: the shimmer's clock, still for reduced motion
  function glow(x, y, r, col, a) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.3, `rgba(${col},${a * 0.4})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
  }
  const onScreen = (x, y, r) => x + r > 0 && x - r < W && y + r > 0 && y - r < H;

  const THINGS = [
    { pos: [0, 0], size: 1.06e-10, fin: [0.02, 0.12], fout: [2, 5], draw(x, y, d, a) {
      const r = d / 2;
      const g = c.createRadialGradient(x, y, 0, x, y, r * 2.6);
      g.addColorStop(0, `rgba(190,180,255,${0.5 * a})`); g.addColorStop(0.25, `rgba(150,140,240,${0.26 * a})`);
      g.addColorStop(0.6, `rgba(110,100,220,${0.07 * a})`); g.addColorStop(1, 'rgba(90,80,200,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 2.6, 0, 6.283); c.fill();
      c.fillStyle = 'rgb(225,220,255)';
      for (const p of atomPts) {
        c.globalAlpha = a * (0.25 + 0.3 * Math.sin(tw * 1.7 + p[2] * 9) ** 2);
        c.fillRect(x + p[0] * d - 0.7, y + p[1] * d - 0.7, 1.4, 1.4);
      }
      c.globalAlpha = 1; glow(x, y, Math.max(4, d * 0.04), '255,240,220', a);
    } },
    { pos: [0, 0], size: 2e-9, fin: [0.03, 0.12], fout: [2.5, 6], draw(x, y, d, a) {
      const ang = -0.38, ux = Math.cos(ang), uy = Math.sin(ang), P = d * 1.7, L = Math.min(d * 45, Math.hypot(W, H));
      const ph = tw * 0.35, n = Math.min(1600, Math.max(60, L / 2.5));
      c.lineCap = 'round';
      for (const [s, col] of [[0, '255,170,200'], [Math.PI * 0.8, '190,180,255']]) {
        c.strokeStyle = `rgba(${col},${0.85 * a})`; c.lineWidth = Math.max(1, d * 0.12);
        c.beginPath();
        for (let i = 0; i <= n; i++) {
          const u = -L + (2 * L * i) / n, w = Math.sin((u / P) * 6.283 + s + ph) * d / 2;
          const px = x + u * ux - w * uy, py = y + u * uy + w * ux;
          i ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.stroke();
      }
      c.lineWidth = Math.max(0.7, d * 0.05);
      const step = P / 10;
      for (let u = -L + ((L % step) || 0); u < L; u += step) {
        const k = (u / P) * 6.283 + ph, w1 = Math.sin(k) * d / 2, w2 = Math.sin(k + Math.PI * 0.8) * d / 2;
        const bx = x + u * ux, by = y + u * uy;
        c.strokeStyle = `rgba(230,220,255,${0.35 * a * (1 - Math.abs(u) / L)})`;
        c.beginPath(); c.moveTo(bx - w1 * uy, by + w1 * ux); c.lineTo(bx - w2 * uy, by + w2 * ux); c.stroke();
      }
    } },
    { pos: [0, 0], size: 1.2e-7, fin: [0.01, 0.06], fout: [1.4, 3], draw(x, y, d, a) {
      const r0 = d * 0.38, rot = tw * 0.04;
      const g = c.createRadialGradient(x - r0 * 0.3, y - r0 * 0.3, r0 * 0.1, x, y, r0);
      g.addColorStop(0, `rgba(150,220,215,${0.55 * a})`); g.addColorStop(1, `rgba(60,110,140,${0.75 * a})`);
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r0, 0, 6.283); c.fill();
      c.strokeStyle = `rgba(200,245,240,${0.6 * a})`; c.lineWidth = Math.max(1, d * 0.012); c.stroke();
      c.lineWidth = Math.max(0.8, d * 0.01);
      for (let i = 0; i < 30; i++) {
        const q = rot + (i / 30) * 6.283, cx = Math.cos(q), sy = Math.sin(q);

  const elName = $('name'), elSize = $('size'), elFact = $('fact'), elLabel = $('label'), elAcross = $('across');
  const track = $('track'), mark = $('mark'), tourBtn = $('tour');
  STOPS.forEach(s => { const e = document.createElement('span'); e.style.left = pos(s.z) * 100 + '%'; track.insertBefore(e, mark); });
  function pos(zz) { return (zz - Z_MIN) / (Z_MAX - Z_MIN); }
  function fmt(m) {
    const n = (v, u) => {
      const p = Math.pow(10, Math.floor(Math.log10(v)) - 1), r = Math.round(v / p) * p;
      return (r >= 1000 ? Math.round(r).toLocaleString('en') : +r.toPrecision(2)) + ' ' + u;
    };
    if (m < 1e-6) return n(m * 1e9, 'nm');
    if (m < 1e-3) return n(m * 1e6, 'µm');
    if (m < 1e-2) return n(m * 1e3, 'mm');
    if (m < 1) return n(m * 100, 'cm');
    if (m < 1e3) return n(m, 'm');
    if (m < 1e9) return n(m / 1e3, 'km');
    if (m < 1e12) return n(m / 1e9, 'million km');
    if (m < 0.2 * LY) return n(m / 1e12, 'billion km');
    const ly = m / LY;
    if (ly < 1e6) return n(ly, 'light-years');
    if (ly < 1e9) return n(ly / 1e6, 'million light-years');
    return n(ly / 1e9, 'billion light-years');
  }
  let shown = -1;
  function words() {
    const i = nearest(z), s = STOPS[i];
    const gap = Math.min(i > 0 ? s.z - STOPS[i - 1].z : 9, i < STOPS.length - 1 ? STOPS[i + 1].z - s.z : 9);
    const o = 1 - ss(0.18, 0.42, Math.abs(z - s.z) / gap);
    if (i !== shown) { shown = i; elName.textContent = s.name; elSize.textContent = s.size; elFact.textContent = s.fact; }
    elLabel.style.opacity = o.toFixed(3);
    elAcross.textContent = '↔ ' + fmt(Math.pow(10, z) * Math.max(W, H) / S);
    mark.style.left = pos(z) * 100 + '%';
    track.setAttribute('aria-valuenow', i); track.setAttribute('aria-valuetext', s.name + ', ' + s.size);
  }

  // ---- input ------------------------------------------------------------------------
  const introEl = $('intro'); let introDone = false;
  function intro(on) { if (introDone) return; if (!on) { introDone = true; introEl.classList.add('off'); } }
  cv.addEventListener('wheel', e => {
    e.preventDefault(); touched();
    const k = e.deltaMode === 1 ? 0.05 : e.deltaMode === 2 ? 1 : 0.0022;
    zT = Math.max(Z_MIN, Math.min(Z_MAX, zT + e.deltaY * k));
  }, { passive: false });
  const ptrs = new Map(); let pinch0 = 0, z0 = 0, dragY = 0;
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); touched();
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); z0 = zT; }
    else { dragY = e.clientY; z0 = zT; }
  });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]); userAt = t;
    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch0 > 0) zT = z0 - Math.log10(d / pinch0) * 1.6;
    } else zT = z0 + (e.clientY - dragY) / H * -4;    // drag up to travel out, down to travel in
    zT = Math.max(Z_MIN, Math.min(Z_MAX, zT));
  });
  const up = e => { ptrs.delete(e.pointerId); pinch0 = 0; if (ptrs.size === 1) { const [p] = [...ptrs.values()]; dragY = p[1]; z0 = zT; } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  function trackPick(e) {
    const b = track.getBoundingClientRect(), zz = Z_MIN + (e.clientX - b.left) / b.width * (Z_MAX - Z_MIN);
    touched(); userAt = t; glideTo(nearest(zz), true);
  }
  track.addEventListener('pointerdown', trackPick);
  function stepStop(k) { touched(); userAt = t; glideTo(Math.max(0, Math.min(STOPS.length - 1, nearest(zT) + k)), true); }
  track.addEventListener('keydown', e => {
    const k = { ArrowRight: 1, ArrowUp: 1, PageUp: 1, ArrowLeft: -1, ArrowDown: -1, PageDown: -1 }[e.key];
    if (k) { e.preventDefault(); stepStop(k); }
    if (e.key === 'Home') { e.preventDefault(); touched(); glideTo(0, true); }
    if (e.key === 'End') { e.preventDefault(); touched(); glideTo(STOPS.length - 1, true); }
  });
  addEventListener('keydown', e => {
    if (e.target === track || e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
    if (e.key === '+' || e.key === '=' || e.key === 'ArrowDown') { touched(); zT -= 0.5; }
    if (e.key === '-' || e.key === '_' || e.key === 'ArrowUp') { touched(); zT += 0.5; }
    if (e.key === 'ArrowRight' || e.key === 'PageUp') stepStop(1);
    if (e.key === 'ArrowLeft' || e.key === 'PageDown') stepStop(-1);
    if (e.key === ' ') { e.preventDefault(); setTour(!touring || paused); }
  });
  function setTour(on) {
    touring = on; paused = !on;
    if (on) { userAt = -1e9; dwell = still ? 6 : 1.2; intro(false); }
    else glide = null;
    tourBtn.textContent = on ? 'pause' : '▶ tour';
    tourBtn.setAttribute('aria-pressed', on);
    tourBtn.setAttribute('aria-label', on ? 'Pause the tour' : 'Play the tour');
  }
  tourBtn.addEventListener('click', () => setTour(!touring || paused));
  setTour(!still);
  if (!still) dwell = 3.5;   // a moment to look at yourself before setting off

  // ---- run --------------------------------------------------------------------------
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; S = Math.min(W, H); CY = H * 0.44;   // a little above the middle, clear of the words
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  addEventListener('resize', size); size();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    t += dt; if (!still) tw += dt;
    step(dt); frame(); words();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(now => { last = now; cv.classList.add('ready'); introEl.classList.add('on'); loop(now); });
  setTimeout(() => intro(false), 9000);
})();
</script>
